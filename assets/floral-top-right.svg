<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <!-- Delicate Line-Art Floral Sketch Top-Right (Mirrored) -->
  <g transform="translate(240, 0) scale(-1, 1)" stroke="#8B1E3F" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <!-- Main curving vine -->
    <path d="M0,0 Q60,30 90,80 T130,150 T160,210" stroke-width="1.4" fill="none"/>
    <path d="M0,40 Q40,60 70,120 T110,180" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M30,0 Q70,40 120,60 T190,80" stroke-width="1.2" fill="none" opacity="0.7"/>

    <!-- Leaves with soft blush tints -->
    <path d="M45,25 Q65,15 75,35 Q60,45 45,25 Z" fill="#F6D5D5" fill-opacity="0.35" stroke-width="1"/>
    <path d="M70,55 Q95,45 105,70 Q85,80 70,55 Z" fill="#F6D5D5" fill-opacity="0.3" stroke-width="1"/>
    <path d="M100,90 Q125,80 130,105 Q110,115 100,90 Z" fill="#F6D5D5" fill-opacity="0.3" stroke-width="1"/>
    <path d="M115,45 Q140,35 150,55 Q130,68 115,45 Z" fill="#F6D5D5" fill-opacity="0.3" stroke-width="1"/>
    <path d="M140,120 Q165,115 170,135 Q150,145 140,120 Z" fill="#F6D5D5" fill-opacity="0.25" stroke-width="0.9"/>
    
    <!-- Delicate Buds & Tiny Petals -->
    <circle cx="165" cy="85" r="4" fill="#B5122E" fill-opacity="0.4" stroke-width="0.8"/>
    <circle cx="190" cy="80" r="3" fill="#8B1E3F" fill-opacity="0.5" stroke-width="0.8"/>
    <circle cx="160" cy="210" r="3.5" fill="#8B1E3F" fill-opacity="0.5" stroke-width="0.8"/>
    <circle cx="130" cy="150" r="4" fill="#B5122E" fill-opacity="0.3" stroke-width="0.8"/>

    <!-- Line Art Rose / Peony Bloom (Top Corner) -->
    <g transform="translate(42, 62) scale(0.85)">
      <path d="M0,-28 C15,-32 30,-20 32,-5 C34,12 18,30 0,32 C-18,30 -34,12 -32,-5 C-30,-20 -15,-32 0,-28 Z" fill="#FFF5F0" fill-opacity="0.65" stroke-width="1.2"/>
      <path d="M-15,-22 C-5,-35 18,-30 25,-15 C30,-2 25,18 10,24 C-5,28 -22,20 -26,5 C-28,-8 -20,-18 -15,-22 Z" fill="#FCE9E4" fill-opacity="0.5" stroke-width="1"/>
      <path d="M-8,-14 C2,-22 16,-18 18,-8 C20,2 12,14 2,16 C-8,16 -16,8 -16,-2 C-16,-8 -12,-12 -8,-14 Z" fill="#F8D3CE" fill-opacity="0.5" stroke-width="1"/>
      <path d="M-3,-6 C3,-10 10,-8 11,-3 C12,3 8,9 2,10 C-4,10 -8,5 -8,0 Z" stroke-width="1.1"/>
      <path d="M0,16 Q5,24 0,32" stroke-width="0.8" opacity="0.6"/>
      <path d="M-10,12 Q-18,18 -25,20" stroke-width="0.8" opacity="0.6"/>
      <path d="M12,10 Q20,16 28,15" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Second Smaller Blossoming Flower -->
    <g transform="translate(105, 30) scale(0.6)">
      <path d="M0,-24 C12,-28 24,-16 25,-4 C26,10 14,24 0,25 C-14,24 -26,10 -25,-4 C-24,-16 -12,-28 0,-24 Z" fill="#FFF5F0" fill-opacity="0.5" stroke-width="1.1"/>
      <path d="M-6,-12 C2,-18 14,-15 15,-6 C16,2 10,12 2,13 C-6,13 -13,6 -13,-2 Z" fill="#FCE9E4" fill-opacity="0.4" stroke-width="1"/>
      <circle cx="1" cy="0" r="4" stroke-width="0.9"/>
    </g>
  </g>
</svg>
