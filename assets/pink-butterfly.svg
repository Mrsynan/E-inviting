<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 52" fill="none">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1E6"/>
      <stop offset="50%" stop-color="#EAA6B4"/>
      <stop offset="100%" stop-color="#C9657A"/>
    </linearGradient>
  </defs>

  <!-- Romantic Vintage Butterfly -->
  <g transform="rotate(-15 30 26)">
    <!-- Left Forewing -->
    <path d="M28,24 C20,12 8,6 4,14 C0,22 10,30 26,26 Z" fill="url(#wingGrad)" fill-opacity="0.82" stroke="#8B1E3F" stroke-width="0.85"/>
    <path d="M12,14 Q20,18 26,24" stroke="#7A1F2B" stroke-width="0.6" opacity="0.65"/>
    <path d="M8,18 Q16,21 24,25" stroke="#7A1F2B" stroke-width="0.6" opacity="0.65"/>

    <!-- Left Hindwing -->
    <path d="M27,27 C18,29 10,38 14,44 C18,48 24,42 28,31 Z" fill="url(#wingGrad)" fill-opacity="0.75" stroke="#8B1E3F" stroke-width="0.8"/>
    <path d="M17,37 Q23,34 27,29" stroke="#7A1F2B" stroke-width="0.5" opacity="0.6"/>

    <!-- Right Forewing (View from 3/4 angle) -->
    <path d="M32,24 C40,10 52,4 56,12 C60,20 50,28 34,26 Z" fill="url(#wingGrad)" fill-opacity="0.9" stroke="#8B1E3F" stroke-width="0.9"/>
    <path d="M48,12 Q40,16 34,24" stroke="#7A1F2B" stroke-width="0.6" opacity="0.65"/>
    <path d="M52,16 Q44,19 36,25" stroke="#7A1F2B" stroke-width="0.6" opacity="0.65"/>

    <!-- Right Hindwing -->
    <path d="M33,27 C42,29 50,38 46,44 C42,48 36,42 32,31 Z" fill="url(#wingGrad)" fill-opacity="0.8" stroke="#8B1E3F" stroke-width="0.8"/>
    <path d="M43,37 Q37,34 33,29" stroke="#7A1F2B" stroke-width="0.5" opacity="0.6"/>

    <!-- Slender Body & Delicate Antennae -->
    <ellipse cx="30" cy="27" rx="1.8" ry="8" fill="#520B16"/>
    <circle cx="30" cy="18" r="1.5" fill="#520B16"/>
    <path d="M30,17 Q25,10 22,8" stroke="#520B16" stroke-width="0.75" stroke-linecap="round"/>
    <path d="M30,17 Q35,10 38,8" stroke="#520B16" stroke-width="0.75" stroke-linecap="round"/>
    <circle cx="22" cy="8" r="0.8" fill="#8B1E3F"/>
    <circle cx="38" cy="8" r="0.8" fill="#8B1E3F"/>
  </g>
</svg>
