<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <!-- 3D Gold Gradients -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D6"/>
      <stop offset="25%" stop-color="#FCE194"/>
      <stop offset="50%" stop-color="#E5AD42"/>
      <stop offset="75%" stop-color="#BA7E21"/>
      <stop offset="100%" stop-color="#7A4B08"/>
    </linearGradient>
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDEC"/>
      <stop offset="35%" stop-color="#F7D488"/>
      <stop offset="70%" stop-color="#D1932B"/>
      <stop offset="100%" stop-color="#8F560C"/>
    </linearGradient>
    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFEFA8" flood-opacity="0.4"/>
    </filter>
  </defs>

