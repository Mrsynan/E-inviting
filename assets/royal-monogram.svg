    <!-- Intertwining 'រ' Flourish (Bride) -->
    <path d="M120 75 C138 75 155 88 158 108 C160 120 155 132 145 140 C138 146 130 148 122 148 C115 148 110 144 110 138 C110 130 118 124 126 124 C132 124 136 128 136 132 C136 135 134 137 131 137 C133 138 136 138 138 136 C144 131 148 122 146 112 C144 98 132 85 118 85 C108 85 100 90 95 98 L88 91 C95 81 106 75 120 75 Z" fill="url(#gold-bevel)" stroke="#7A4B08" stroke-width="1.8"/>

