    <path d="M112 148 C112 175 112 200 112 215 C112 220 116 222 120 222 C124 222 128 220 128 215 C128 200 128 175 128 148 Z" fill="url(#gold-bevel)" stroke="#7A4B08" stroke-width="1.5"/>

    <!-- Left & Right Royal Ribbon Flourishes -->
    <path d="M42 110 C30 115 22 128 24 142 C26 154 36 162 48 160 C58 158 64 148 62 138 C60 130 52 125 44 128 C38 130 36 136 38 140 C40 144 45 144 47 141 C47 138 45 136 42 136 C44 134 48 134 50 137 C52 143 46 150 38 148 C30 146 28 138 29 130 C30 120 38 112 46 108 Z" fill="url(#gold-light)" stroke="#8F560C" stroke-width="1.5"/>
    
    <path d="M152 110 C164 115 172 128 170 142 C168 154 158 162 146 160 C136 158 130 148 132 138 C134 130 142 125 150 128 C156 130 158 136 156 140 C154 144 149 144 147 141 C147 138 149 136 152 136 C150 134 146 134 144 137 C142 143 148 150 156 148 C164 146 166 138 165 130 C164 120 156 112 148 108 Z" fill="url(#gold-bevel)" stroke="#7A4B08" stroke-width="1.5"/>

    <!-- Bottom Ornate Base Scroll -->
    <path d="M70 215 C82 220 95 224 100 224 C105 224 118 220 130 215 C136 220 142 226 138 230 C132 235 116 236 100 236 C84 236 68 235 62 230 C58 226 64 220 70 215 Z" fill="url(#gold-light)" stroke="#7A4B08" stroke-width="1.5"/>
