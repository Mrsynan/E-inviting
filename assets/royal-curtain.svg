<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" preserveAspectRatio="none">
  <defs>
    <!-- Rich Theater Velvet Gradients -->
    <linearGradient id="velvet-fold-main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240207"/>
      <stop offset="15%" stop-color="#5A0A16"/>
      <stop offset="35%" stop-color="#841324"/>
      <stop offset="50%" stop-color="#9C1A2E"/>
      <stop offset="65%" stop-color="#6E0E1D"/>
      <stop offset="85%" stop-color="#42060F"/>
      <stop offset="100%" stop-color="#1E0206"/>
    </linearGradient>

    <linearGradient id="valance-swag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9E1B2E"/>
      <stop offset="40%" stop-color="#6E0E1D"/>
      <stop offset="75%" stop-color="#42060F"/>
      <stop offset="100%" stop-color="#200206"/>
    </linearGradient>

    <!-- Metallic Gold Trim & Tassels -->
    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A56E14"/>
      <stop offset="25%" stop-color="#FCE194"/>
      <stop offset="50%" stop-color="#FFF9DE"/>
      <stop offset="75%" stop-color="#E5AA3A"/>
      <stop offset="100%" stop-color="#99600D"/>
    </linearGradient>

    <filter id="drape-shadow" x="-10%" y="0%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Left Side Cascading Velvet Drapery -->
  <g>
    <!-- Fold 1 (Outer edge) -->
    <path d="M0 0 L58 0 C54 90 50 200 44 340 L0 340 Z" fill="#240207"/>
    <path d="M12 0 L52 0 C48 90 44 200 40 340 L16 340 Z" fill="#480712"/>
    <!-- Fold 2 -->
    <path d="M25 0 L72 0 C66 100 62 210 54 340 L30 340 Z" fill="#6E0E1D"/>
    <!-- Fold 3 (Vibrant Highlight) -->
    <path d="M38 0 L80 0 C74 105 68 220 58 340 L45 340 Z" fill="#94172B"/>
    <!-- Fold 4 -->
    <path d="M52 0 L90 0 C82 110 74 230 64 340 L55 340 Z" fill="#4A0712"/>
    <path d="M68 0 L96 0 C88 115 80 235 70 340 L62 340 Z" fill="#781020"/>
    <!-- Soft inner taper curve shadow -->
    <path d="M78 0 C105 45 100 130 84 235 C76 280 72 320 68 340 L62 340 C68 290 74 240 82 180 C90 100 86 35 70 0 Z" fill="#180104" opacity="0.9"/>

    <!-- Left Hanging Gold Cord & Tassel -->
    <path d="M65 0 C75 60 78 120 75 180" stroke="url(#gold-shimmer)" stroke-width="2" fill="none"/>
    <circle cx="75" cy="180" r="4.5" fill="url(#gold-shimmer)"/>
    <path d="M72 184 L70 206 L80 206 L78 184 Z" fill="url(#gold-shimmer)"/>
    <circle cx="75" cy="206" r="2.5" fill="#FFEFA8"/>
  </g>

  <!-- Right Side Cascading Velvet Drapery (Mirrored) -->
  <g transform="translate(480, 0) scale(-1, 1)">
    <!-- Fold 1 (Outer edge) -->
    <path d="M0 0 L58 0 C50 90 46 200 44 340 L0 340 Z" fill="#240207"/>
    <path d="M12 0 L52 0 C48 90 44 200 40 340 L16 340 Z" fill="#480712"/>
    <!-- Fold 2 -->
    <path d="M25 0 L72 0 C66 100 62 210 54 340 L30 340 Z" fill="#6E0E1D"/>
    <!-- Fold 3 (Vibrant Highlight) -->
    <path d="M38 0 L80 0 C74 105 68 220 58 340 L45 340 Z" fill="#94172B"/>
    <!-- Fold 4 -->
    <path d="M52 0 L90 0 C82 110 74 230 64 340 L55 340 Z" fill="#4A0712"/>
    <path d="M68 0 L96 0 C88 115 80 235 70 340 L62 340 Z" fill="#781020"/>
    <!-- Soft inner taper curve shadow -->
    <path d="M78 0 C105 45 100 130 84 235 C76 280 72 320 68 340 L62 340 C68 290 74 240 82 180 C90 100 86 35 70 0 Z" fill="#180104" opacity="0.9"/>

    <!-- Right Hanging Gold Cord & Tassel -->
    <path d="M65 0 C75 60 78 120 75 180" stroke="url(#gold-shimmer)" stroke-width="2" fill="none"/>
    <circle cx="75" cy="180" r="4.5" fill="url(#gold-shimmer)"/>
    <path d="M72 184 L70 206 L80 206 L78 184 Z" fill="url(#gold-shimmer)"/>
    <circle cx="75" cy="206" r="2.5" fill="#FFEFA8"/>
  </g>

  <!-- Top Theater Swags & Scalloped Valances -->
  <g filter="url(#drape-shadow)">
    <!-- Header Velvet Valance Bar -->
    <path d="M0 0 L480 0 L480 22 C380 26 340 40 240 40 C140 40 100 26 0 22 Z" fill="#3A050D"/>
    <path d="M0 20 C100 24 140 38 240 38 C340 38 380 24 480 20" stroke="url(#gold-shimmer)" stroke-width="1.8" fill="none"/>

    <!-- Left Outer Dramatic Swag -->
    <path d="M0 0 L160 0 C145 52 100 90 0 105 Z" fill="url(#valance-swag)"/>
    <path d="M0 0 L145 0 C130 45 92 78 0 90 Z" fill="#781020" opacity="0.6"/>
    <path d="M0 0 L125 0 C110 38 80 62 0 72 Z" fill="#9C1A2E" opacity="0.75"/>
    <path d="M0 105 C100 90 145 52 160 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Right Outer Dramatic Swag -->
    <path d="M480 0 L320 0 C335 52 380 90 480 105 Z" fill="url(#valance-swag)"/>
    <path d="M480 0 L335 0 C350 45 388 78 480 90 Z" fill="#781020" opacity="0.6"/>
    <path d="M480 0 L355 0 C370 38 400 62 480 72 Z" fill="#9C1A2E" opacity="0.75"/>
    <path d="M480 105 C380 90 335 52 320 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Center Left Swag -->
    <path d="M90 0 C112 40 155 72 205 74 C225 76 240 64 245 55 C232 42 210 20 198 0 Z" fill="url(#valance-swag)"/>
    <path d="M105 0 C128 34 165 60 205 62 C220 63 234 54 240 46 L190 0 Z" fill="#9C1A2E" opacity="0.65"/>
    <path d="M90 0 C112 40 155 72 205 74 C225 76 240 64 245 55" stroke="url(#gold-shimmer)" stroke-width="2.2" fill="none"/>

    <!-- Center Right Swag -->
    <path d="M390 0 C368 40 325 72 275 74 C255 76 240 64 235 55 C248 42 270 20 282 0 Z" fill="url(#valance-swag)"/>
    <path d="M375 0 C352 34 315 60 275 62 C260 63 246 54 240 46 L290 0 Z" fill="#9C1A2E" opacity="0.65"/>
    <path d="M390 0 C368 40 325 72 275 74 C255 76 240 64 235 55" stroke="url(#gold-shimmer)" stroke-width="2.2" fill="none"/>

    <!-- Center Main Swag Pelmet -->
    <path d="M165 0 C182 32 208 48 240 48 C272 48 298 32 315 0 Z" fill="url(#valance-swag)"/>
    <path d="M180 0 C195 26 216 38 240 38 C264 38 285 26 300 0 Z" fill="#AC2034" opacity="0.85"/>
    <path d="M165 0 C182 32 208 48 240 48 C272 48 298 32 315 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Center Hanging Golden Tassel -->
    <circle cx="240" cy="50" r="5" fill="url(#gold-shimmer)"/>
    <path d="M237 54 L235 72 L245 72 L243 54 Z" fill="url(#gold-shimmer)"/>
    <circle cx="240" cy="72" r="2.8" fill="#FFF8D6"/>
  </g>
</svg>
