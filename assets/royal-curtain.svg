<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 480 1000" preserveAspectRatio="none">
  <defs>
    <!-- Royal Sapphire Blue Velvet Gradients -->
    <linearGradient id="valance-swag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6DE8"/>
      <stop offset="40%" stop-color="#1250A8"/>
      <stop offset="75%" stop-color="#083072"/>
      <stop offset="100%" stop-color="#03163E"/>
    </linearGradient>

    <linearGradient id="side-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09357C"/>
      <stop offset="40%" stop-color="#175FBD"/>
      <stop offset="70%" stop-color="#2D82FA"/>
      <stop offset="100%" stop-color="#0D4192"/>
    </linearGradient>

    <linearGradient id="side-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02102E" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#051C4A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#02102E" stop-opacity="0"/>
    </linearGradient>

    <!-- Metallic Gold Trim & Tassels -->
    <linearGradient id="gold-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A56E14"/>
      <stop offset="25%" stop-color="#FCE194"/>
      <stop offset="50%" stop-color="#FFF9DE"/>
      <stop offset="75%" stop-color="#E5AA3A"/>
      <stop offset="100%" stop-color="#99600D"/>
    </linearGradient>

    <filter id="drape-shadow" x="-10%" y="0%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- LEFT SIDE CONTINUOUS FULL-HEIGHT SAPPHIRE VELVET DRAPERY (Top to Bottom: 0 to 1000) -->
  <g>
    <!-- Fold 1 (Outer border) -->
    <path d="M0 0 L42 0 C40 300 38 700 36 1000 L0 1000 Z" fill="#02102E"/>
    <!-- Fold 2 (Deep navy) -->
    <path d="M10 0 L50 0 C47 300 44 700 42 1000 L12 1000 Z" fill="#062254"/>
    <!-- Fold 3 (Velvet mid-tone blue) -->
    <path d="M20 0 L60 0 C56 300 52 700 50 1000 L24 1000 Z" fill="#0D3A85"/>
    <!-- Fold 4 (Vibrant sapphire highlight) -->
    <path d="M30 0 L66 0 C62 300 57 700 55 1000 L35 1000 Z" fill="url(#side-crimson)"/>
    <!-- Fold 5 (Inner crevice shadow) -->
    <path d="M48 0 L60 0 C56 300 52 700 50 1000 L42 1000 Z" fill="#03163E"/>
    <!-- Fold 6 (Inner velvet roll) -->
    <path d="M52 0 L70 0 C65 300 60 700 58 1000 L46 1000 Z" fill="#134DA0"/>
    <!-- Fold 7 (Inner crest accent) -->
    <path d="M56 0 L66 0 C62 300 58 700 55 1000 L50 1000 Z" fill="#2A7BF5" opacity="0.8"/>
    <!-- Soft inner feather shadow -->
    <path d="M60 0 L78 0 C72 300 66 700 64 1000 L52 1000 Z" fill="url(#side-shadow)"/>
  </g>

  <!-- RIGHT SIDE CONTINUOUS FULL-HEIGHT SAPPHIRE VELVET DRAPERY (Mirrored) -->
  <g transform="translate(480, 0) scale(-1, 1)">
    <!-- Fold 1 (Outer border) -->
    <path d="M0 0 L42 0 C40 300 38 700 36 1000 L0 1000 Z" fill="#02102E"/>
    <!-- Fold 2 (Deep navy) -->
    <path d="M10 0 L50 0 C47 300 44 700 42 1000 L12 1000 Z" fill="#062254"/>
    <!-- Fold 3 (Velvet mid-tone blue) -->
    <path d="M20 0 L60 0 C56 300 52 700 50 1000 L24 1000 Z" fill="#0D3A85"/>
    <!-- Fold 4 (Vibrant sapphire highlight) -->
    <path d="M30 0 L66 0 C62 300 57 700 55 1000 L35 1000 Z" fill="url(#side-crimson)"/>
    <!-- Fold 5 (Inner crevice shadow) -->
    <path d="M48 0 L60 0 C56 300 52 700 50 1000 L42 1000 Z" fill="#03163E"/>
    <!-- Fold 6 (Inner velvet roll) -->
    <path d="M52 0 L70 0 C65 300 60 700 58 1000 L46 1000 Z" fill="#134DA0"/>
    <!-- Fold 7 (Inner crest accent) -->
    <path d="M56 0 L66 0 C62 300 58 700 55 1000 L50 1000 Z" fill="#2A7BF5" opacity="0.8"/>
    <!-- Soft inner feather shadow -->
    <path d="M60 0 L78 0 C72 300 66 700 64 1000 L52 1000 Z" fill="url(#side-shadow)"/>
  </g>

  <!-- Left Hanging Gold Cord & Tassel -->
  <g>
    <path d="M58 0 C64 40 66 85 64 125" stroke="url(#gold-shimmer)" stroke-width="2" fill="none"/>
    <circle cx="64" cy="125" r="4.5" fill="url(#gold-shimmer)"/>
    <path d="M61 128 L59 148 L70 148 L67 128 Z" fill="url(#gold-shimmer)"/>
    <circle cx="64" cy="148" r="2.5" fill="#FFEFA8"/>
  </g>

  <!-- Right Hanging Gold Cord & Tassel -->
  <g transform="translate(480, 0) scale(-1, 1)">
    <path d="M58 0 C64 40 66 85 64 125" stroke="url(#gold-shimmer)" stroke-width="2" fill="none"/>
    <circle cx="64" cy="125" r="4.5" fill="url(#gold-shimmer)"/>
    <path d="M61 128 L59 148 L70 148 L67 128 Z" fill="url(#gold-shimmer)"/>
    <circle cx="64" cy="148" r="2.5" fill="#FFEFA8"/>
  </g>

  <!-- TOP THEATER SWAGS & SCALLOPED VALANCES (Seamlessly Overlaying Sides) -->
  <g filter="url(#drape-shadow)">
    <!-- Header Velvet Valance Bar -->
    <path d="M0 0 L480 0 L480 20 C380 24 340 36 240 36 C140 36 100 24 0 20 Z" fill="#041E4E"/>
    <path d="M0 18 C100 22 140 34 240 34 C340 34 380 22 480 18" stroke="url(#gold-shimmer)" stroke-width="1.8" fill="none"/>

    <!-- Left Outer Dramatic Swag -->
    <path d="M0 0 L160 0 C145 52 100 90 0 105 Z" fill="url(#valance-swag)"/>
    <path d="M0 0 L145 0 C130 45 92 78 0 90 Z" fill="#0A3275" opacity="0.6"/>
    <path d="M0 0 L125 0 C110 38 80 62 0 72 Z" fill="#1C67DD" opacity="0.75"/>
    <path d="M0 105 C100 90 145 52 160 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Right Outer Dramatic Swag -->
    <path d="M480 0 L320 0 C335 52 380 90 480 105 Z" fill="url(#valance-swag)"/>
    <path d="M480 0 L335 0 C350 45 388 78 480 90 Z" fill="#0A3275" opacity="0.6"/>
    <path d="M480 0 L355 0 C370 38 400 62 480 72 Z" fill="#1C67DD" opacity="0.75"/>
    <path d="M480 105 C380 90 335 52 320 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Center Left Swag -->
    <path d="M90 0 C112 40 155 72 205 74 C225 76 240 64 245 55 C232 42 210 20 198 0 Z" fill="url(#valance-swag)"/>
    <path d="M105 0 C128 34 165 60 205 62 C220 63 234 54 240 46 L190 0 Z" fill="#1C67DD" opacity="0.65"/>
    <path d="M90 0 C112 40 155 72 205 74 C225 76 240 64 245 55" stroke="url(#gold-shimmer)" stroke-width="2.2" fill="none"/>

    <!-- Center Right Swag -->
    <path d="M390 0 C368 40 325 72 275 74 C255 76 240 64 235 55 C248 42 270 20 282 0 Z" fill="url(#valance-swag)"/>
    <path d="M375 0 C352 34 315 60 275 62 C260 63 246 54 240 46 L290 0 Z" fill="#1C67DD" opacity="0.65"/>
    <path d="M390 0 C368 40 325 72 275 74 C255 76 240 64 235 55" stroke="url(#gold-shimmer)" stroke-width="2.2" fill="none"/>

    <!-- Center Main Swag Pelmet -->
    <path d="M165 0 C182 32 208 48 240 48 C272 48 298 32 315 0 Z" fill="url(#valance-swag)"/>
    <path d="M180 0 C195 26 216 38 240 38 C264 38 285 26 300 0 Z" fill="#2575EB" opacity="0.85"/>
    <path d="M165 0 C182 32 208 48 240 48 C272 48 298 32 315 0" stroke="url(#gold-shimmer)" stroke-width="2.6" fill="none"/>

    <!-- Center Hanging Golden Tassel -->
    <circle cx="240" cy="50" r="5" fill="url(#gold-shimmer)"/>
    <path d="M237 54 L235 72 L245 72 L243 54 Z" fill="url(#gold-shimmer)"/>
    <circle cx="240" cy="72" r="2.8" fill="#FFF8D6"/>
  </g>
</svg>