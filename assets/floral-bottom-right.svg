      <path d="M138,42 Q158,25 168,48 Q148,58 138,42 Z" fill="#FCE9E4" fill-opacity="0.3"/>
      <path d="M162,142 Q188,128 192,150 Q172,160 162,142 Z" fill="#FCE9E4" fill-opacity="0.3"/>
      <circle cx="140" cy="40" r="3.5" fill="#8B1E3F" fill-opacity="0.6"/>
