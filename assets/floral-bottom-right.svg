      <path d="M-32,-25 C-44,-8 -35,18 -15,28 C8,36 34,25 36,2 C38,-18 20,-35 -5,-36 C-20,-37 -28,-32 -32,-25 Z" fill="url(#blushRoseR)"/>
      <path d="M-22,5 C-28,20 -5,30 15,24 C30,18 30,-5 18,-18 C5,-28 -15,-18 -22,5 Z" fill="url(#creamRoseR)"/>
      <path d="M-14,-10 C-18,4 -5,16 8,14 C20,12 20,-4 10,-12 C0,-20 -10,-18 -14,-10 Z" fill="#FCE1D4"/>
