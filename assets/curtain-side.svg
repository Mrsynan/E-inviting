<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 1000" preserveAspectRatio="none">
  <defs>
    <!-- Velvet Vertical Fold Gradients -->
    <linearGradient id="side-fold-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180104"/>
      <stop offset="100%" stop-color="#3A050D"/>
    </linearGradient>

    <linearGradient id="side-fold-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4D0713"/>
      <stop offset="45%" stop-color="#8C1324"/>
      <stop offset="75%" stop-color="#A81D32"/>
      <stop offset="100%" stop-color="#550815"/>
    </linearGradient>

    <linearGradient id="side-fold-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180104" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#240207" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#180104" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cascading Full-Height Vertical Velvet Drapery -->
  <g>
    <!-- Fold 1 (Outer edge deep background) -->
    <path d="M0 0 L40 0 C38 300 36 700 34 1000 L0 1000 Z" fill="#180104"/>

    <!-- Fold 2 (Deep velvet burgundy) -->
    <path d="M8 0 L46 0 C44 300 42 700 40 1000 L10 1000 Z" fill="#3D060F"/>

    <!-- Fold 3 (Velvet mid-tone body) -->
    <path d="M18 0 L55 0 C53 300 50 700 48 1000 L22 1000 Z" fill="#630C19"/>

    <!-- Fold 4 (Vibrant velvet crest highlight) -->
    <path d="M26 0 L58 0 C56 300 53 700 51 1000 L32 1000 Z" fill="url(#side-fold-crimson)"/>

    <!-- Fold 5 (Deep crevice shadow) -->
    <path d="M42 0 L54 0 C52 300 49 700 47 1000 L38 1000 Z" fill="#240207"/>

    <!-- Fold 6 (Inner velvet roll) -->
    <path d="M46 0 L64 0 C62 300 59 700 57 1000 L44 1000 Z" fill="#750E1F"/>

    <!-- Fold 7 (Inner crest accent) -->
    <path d="M50 0 L60 0 C58 300 55 700 53 1000 L48 1000 Z" fill="#9E1A2E" opacity="0.8"/>

    <!-- Soft inner shadow feathering into page content -->
    <path d="M54 0 L70 0 C68 300 66 700 64 1000 L50 1000 Z" fill="url(#side-fold-shadow)"/>
  </g>
</svg>